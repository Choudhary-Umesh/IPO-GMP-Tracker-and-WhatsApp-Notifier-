name: Keepalive

# GitHub automatically DISABLES scheduled workflows in a repository that has
# had no commit activity for 60 days. This workflow makes a tiny commit every
# two weeks so your daily IPO alert never silently dies.

on:
  schedule:
    - cron: "17 3 1,15 * *"   # 1st and 15th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat file and commit
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last_run.txt
          git commit -m "chore: keepalive heartbeat" || exit 0
          git push
